# Defaults here are safe for LOCAL development only.
# application-prod.yml overrides secrets with no defaults, so a missing value fails at startup.
# Every variable is documented in docs/deployment.md §4.

spring:
  application:
    name: hireflow
  config:
    # Reads KEY=value pairs from a git-ignored .env (backend/ or repo root), if present.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/hireflow}
    username: ${DB_USERNAME:hireflow}
    password: ${DB_PASSWORD:hireflow}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks entities match it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100        # ?size=10000 is silently capped

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

hireflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  jwt:
    # The default is a PUBLIC placeholder for local development only. application-prod.yml has no default.
    secret: ${JWT_SECRET:bG9jYWwtZGV2LW9ubHktaW5zZWN1cmUtand0LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2Q=}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
    issuer: hireflow
  refresh-cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Lax}
  super-admin:
    name: ${SUPER_ADMIN_NAME:Platform Admin}
    email: ${SUPER_ADMIN_EMAIL:}
    password: ${SUPER_ADMIN_PASSWORD:}
